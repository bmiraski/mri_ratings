name: Live scores

# Started every fifteen minutes by an outside cron (cron-job.org) calling this
# workflow's dispatch API, because GitHub's own scheduler does not keep time:
# asked for a run every fifteen minutes, it started about one in twenty. The
# schedule below stays as a backup, off the quarter-hour where GitHub is busiest.
#
# A run that finds a game on stays up through it - reading the scoreboard every
# five minutes and committing each change - and waits out a kickoff that is
# close, so a single dispatch that lands covers the whole window. Otherwise it
# reads each sport's slate.json and live.json and exits in seconds.
#
# Standard library only, on the runner's own Python: no setup or installs.

on:
  schedule:
    - cron: "7,22,37,52 * * 1-4,8-12 *"   # backup only: football August to January, basketball November to April
  workflow_dispatch:

# One run at a time. A dispatch that arrives while a run is watching a game waits
# in line, and exits at once when its turn comes if the game is over.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350                 # the script stops itself at 5h30, inside GitHub's six-hour limit
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Watch the live window
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PYTHONPATH=src python3 scripts/live_scores.py --watch
