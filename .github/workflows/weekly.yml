name: Refresh ratings

# The site is served straight from docs/, so this workflow is the only thing
# that needs the API key. It rebuilds and commits the output; GitHub Pages
# picks the change up on its own.
#
# Sunday morning is the real run, once a weekend of games is final. The
# midweek and Saturday runs catch stragglers and, later, betting lines.
#
# The same three runs refresh basketball, which is in season from November to
# April - roughly the half of the year football is not. Out of season the
# basketball pages hold the completed season, marked final, rather than going
# blank.

on:
  schedule:
    - cron: "0 13 * * 1"   # Monday 13:00 UTC - Sunday games are final
    - cron: "0 13 * * 4"   # Thursday - midweek games
    - cron: "0 15 * * 6"   # Saturday - ahead of kickoff
  workflow_dispatch:        # and a button, for when you want it now

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # v7 on both: Node 20 is removed from the runners on 2026-09-23.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild the site
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: PYTHONPATH=src python3 scripts/build_site.py

      - name: Check the ratings still hold up
        run: PYTHONPATH=src python3 -m pytest tests/ -q

      - name: Commit the refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/raw site/data
          if git diff --staged --quiet; then
            echo "No new games since the last run."
          else
            git commit -m "Refresh ratings ($(date -u '+%Y-%m-%d'))"
            git push
          fi
