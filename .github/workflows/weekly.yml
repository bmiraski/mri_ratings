name: Refresh ratings

# The site is served straight from docs/, so this workflow is the only thing
# that needs the API key. It rebuilds and commits the output; GitHub Pages
# picks the change up on its own.
#
# Daily, because basketball plays daily. College basketball runs six or seven
# nights a week from November to April, so a Monday/Thursday/Saturday cadence
# would price a betting board off ratings up to three days stale - and three
# days is a dozen games for every team in a conference.
#
# 08:47 UTC is 2:47am Central, 12:47am Pacific: after nearly every west-coast game
# has gone final. GitHub starts scheduled runs late - the daily run has been
# starting four to six hours after its time, 9:30am to 12:30pm Central - so this
# is set early on purpose, to land the refresh around 7-8am Central, before
# anyone is reading. The extra Saturday run is for football, ahead of kickoff.
#
# Out of season the basketball pages hold the completed season, marked final,
# rather than going blank - and cost nothing to refresh, since a month that has
# already ended is never re-fetched.

on:
  schedule:
    - cron: "47 8 * * *"   # daily 08:47 UTC - last night's games are final; off the hour, where GitHub runs late
    - cron: "47 14 * * 6"  # Saturday - ahead of football kickoff
  workflow_dispatch:        # and a button, for when you want it now

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # v7 on both: Node 20 is removed from the runners on 2026-09-23.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild the site
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: PYTHONPATH=src python3 scripts/build_site.py

      - name: Check the ratings still hold up
        run: PYTHONPATH=src python3 -m pytest tests/ -q

      - name: Commit the refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/raw site/data
          if git diff --staged --quiet; then
            echo "No new games since the last run."
          else
            git commit -m "Refresh ratings ($(date -u '+%Y-%m-%d'))"
            # The live-score job commits docs/live.json during games, so main may
            # have moved during a long build. The two never touch the same file.
            for attempt in 1 2 3; do
              git pull --rebase --quiet && git push && exit 0
              sleep 5
            done
            exit 1
          fi
