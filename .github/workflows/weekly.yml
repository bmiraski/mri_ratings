name: Refresh ratings

# The site is served straight from docs/, so this workflow is the only thing
# that needs the API key. It rebuilds and commits the output; GitHub Pages
# picks the change up on its own.
#
# Daily, because basketball plays daily. College basketball runs six or seven
# nights a week from November to April, so a Monday/Thursday/Saturday cadence
# would price a betting board off ratings up to three days stale - and three
# days is a dozen games for every team in a conference.
#
# 11:00 UTC is 6am Eastern, 3am Pacific: after the last west-coast game has
# gone final and before anyone is reading. The extra Saturday run is for
# football, ahead of kickoff.
#
# Out of season the basketball pages hold the completed season, marked final,
# rather than going blank - and cost nothing to refresh, since a month that has
# already ended is never re-fetched.

on:
  schedule:
    - cron: "0 11 * * *"   # daily 11:00 UTC - last night's games are final
    - cron: "0 15 * * 6"   # Saturday - ahead of football kickoff
  workflow_dispatch:        # and a button, for when you want it now

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # v7 on both: Node 20 is removed from the runners on 2026-09-23.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild the site
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: PYTHONPATH=src python3 scripts/build_site.py

      - name: Check the ratings still hold up
        run: PYTHONPATH=src python3 -m pytest tests/ -q

      - name: Commit the refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/raw site/data
          if git diff --staged --quiet; then
            echo "No new games since the last run."
          else
            git commit -m "Refresh ratings ($(date -u '+%Y-%m-%d'))"
            git push
          fi
